server {
    listen 443 ssl;
    server_name locator.theofficialblacksheepco.online;

    ssl_certificate     /certs-online/fullchain.cer;
    ssl_certificate_key /certs-online/locator.theofficialblacksheepco.online.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://100.99.131.20:15000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
