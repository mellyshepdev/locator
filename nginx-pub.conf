# locator-tailnet-pub — public entrypoint splitter.
#
# Was a raw socat TCP forward to locator:5000, which made the whole public
# site (UI pages AND API) one process. Now paths are split the same way the
# Traefik mesh routers split them: known API/programmatic paths go straight
# to the Flask container, everything else goes to locator-ui (which serves
# the static dashboard and proxies unknown paths back here — to the API —
# anyway). Result: `docker stop locator-ui` takes down the HTML pages only;
# /api/, /nodes/, /wake/ etc. keep answering through this listener.
server {
    listen 8080;
    server_name _;

    client_max_body_size 16m;

    # Programmatic paths — mirrors the locator-api Traefik router rule.
    # /__wake/ rides this listener too (upstream Traefik proxies it here).
    location ~ ^/(api/|register|deregister/|nodes/|wake/|__wake/|health|silent-check-sso\.html|static/lokey-android) {
        proxy_pass http://locator:5000;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://locator-ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
