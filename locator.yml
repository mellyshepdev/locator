# Service policy. Read by the locator on every change (no restart needed).
#
# location_type:  stationary = never migrate. Use for anything holding data on
#                 local disk, since migration moves the compose file and NOT the
#                 volume — a "moved" database arrives empty while the only copy
#                 stays behind.
#                 mobile = may be rebalanced between units.
# deployment_type: essential | optional  (informational)
# units:          current_unit (default) | all | 8 | "7_8_9"
#                 ALWAYS QUOTE the underscore form — YAML 1.1 treats
#                 underscores as digit separators, so a bare 7_8_9 parses as
#                 the integer 789 and the policy silently matches nothing.
# instances:      how many per unit (default 1)
# project_dir /
# git_remote:     opt in to placement enforcement. Without one of these the
#                 locator will NOT fan a service out, because a queued deploy
#                 carries only a container name and the target would have
#                 nothing to check out.
# env:            .env values for the target ('common' + per-unit override).
#                 lokey merges them and never overwrites an existing key.

Service:
  # ── Stationary: hold data on local disk ────────────────────────────────
  mariadb-11.4:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  mariadb-pdns:
    deployment_type: essential
    location_type: stationary
    units: "9"
    instances: 1

  postgres:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  comms-postgres:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  postgres-inventory-backup:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1

  matomo-db:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  synapse:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  chatwoot-rails:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  # ── Stationary: bound to a unit's identity or network position ─────────
  # ── DNS + reverse proxy: the fleet's front door ────────────────────────
  # Filled out 2026-08-28. Verified live against every unit on that date:
  #   unit8  pdns, mariadb-pdns-primary, dnsdist, traefik, traefik-certs-dumper
  #   unit7  traefik
  #   unit9  pdns, mariadb-pdns-replica9, mariadb-pdns
  #
  # Every entry here is stationary AND carries a units: list that names each
  # unit it really runs on. Both matter, for different reasons:
  #   - stationary keeps the rebalancer from moving a compose file away from
  #     the volume holding the zone data.
  #   - units: is what _is_multi_unit_service() reads, and that is the ONLY
  #     thing that exempts a service from _enforce_dedup. traefik was declared
  #     units: "8" while a second traefik has been running on unit7 for days,
  #     which is exactly the shape that produced the nasa eviction loop above.
  #
  # QUOTE every underscore form. A bare 8_9 is the integer 89 (YAML 1.1 digit
  # separators) and matches no unit at all.
  traefik:
    deployment_type: essential
    location_type: stationary
    units: "7_8"
    instances: 1

  # Writes the ACME cert bundle out of acme.json for the services that read
  # PEMs off disk. Bound to unit8 because that is where acme.json lives.
  traefik-certs-dumper:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  # Authoritative DNS. unit8 is primary, unit9 is the AXFR secondary - both
  # answer on :53, so losing either is a real outage, not a degraded read.
  pdns:
    deployment_type: essential
    location_type: stationary
    units: "8_9"
    instances: 1

  # pdns's backing store. These are NOT interchangeable: the primary holds the
  # writable copy that pdnsutil edits, the replica9 copy is fed by replication.
  # Migrating either moves the compose file and leaves the volume behind.
  mariadb-pdns-primary:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  mariadb-pdns-replica9:
    deployment_type: essential
    location_type: stationary
    units: "9"
    instances: 1

  # The :53 front end on unit8 that fans queries out to pdns.
  dnsdist:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  # The two public web front doors. Both are bound to unit8 by an A record in
  # pdns and by Traefik's file provider, so a migration would move the compose
  # file while DNS kept pointing here — the site would simply go dark.
  main-site-apache:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1


  # ── STOP-GAP, added 2026-08-23 ─────────────────────────────────────────
  # nasa is ONLINE on unit7 AND unit9, so _enforce_dedup tried to evict the
  # unit7 copy with a git_push_and_stop every ~90s. It failed every time —
  # unit7's nasa was started with `docker run`, not compose, so it carries no
  # com.docker.compose.* labels and lokey cannot find a project dir to push.
  # A FAILED dedup migration no longer blocks the next one, so it relaunched
  # forever: 147 failures between 20:48 and 01:00.
  #
  # Declaring both units is what actually stops it. location_type: stationary
  # does NOT — _enforce_dedup only exempts via _PINNED_NAMES or
  # _is_multi_unit_service(), and the latter reads THIS field.
  #
  # This is deliberately NOT the end state: nasa is meant to be migratable.
  # To get there, give it a real compose project on unit7 (a docker-compose.yml
  # + `docker compose up -d` so the labels exist), add project_dir/git_remote
  # here, then narrow units back to one. Until the labels exist, no migration
  # of nasa can ever succeed.
  #
  # QUOTED on purpose: YAML 1.1 reads a bare 7_9 as the integer 79.
  nasa:
    deployment_type: optional
    location_type: mobile
    units: "7_9"
    instances: 1

  # ── Fleet-wide log shipper (live-logger) ───────────────────────────────
  # Added 2026-08-23. Both were stopped and stayed stopped: fluent-bit is
  # restart: unless-stopped and had been deliberately SIGTERMed, which that
  # policy never recovers from, and container-names is restart: "no", so any
  # kill is permanent.
  #
  # deployment_type: essential is set here but is NOT protection today. Tested
  # 2026-08-23: policy loaded, the registry correctly saw
  # live-logger-container-names@unit9 go OFFLINE, and
  # critical_service_watchdog() queued no start in 5 minutes. Treat these two
  # as unsupervised until that is fixed; the flag only drives the grid badge.
  #
  # units MUST be present and MUST be quoted. Without it
  # _is_multi_unit_service() is false and _enforce_dedup treats the per-unit
  # shippers as duplicates and evicts all but one — the exact loop that
  # bug #6 fixed. A bare 4_7_8_9 is the integer 4789 (YAML 1.1 digit
  # separators) and matches no unit at all.
  #
  # stationary because fluent_bit_state holds this unit's tail read-offsets
  # and retry buffer, and migration moves the compose file, not the volume.
  fluent-bit:
    deployment_type: essential
    location_type: stationary
    units: "4_7_8_9"
    instances: 1
    restart_when_stopped: true

  live-logger-container-names:
    deployment_type: essential
    location_type: stationary
    units: "4_7_8_9"
    instances: 1
    restart_when_stopped: true

  # ── lokey — the host agent, every unit ─────────────────────────────────
  # Added 2026-08-23.
  #
  # QUOTED: a bare 3_4_5_6_7_8_9 is the integer 3456789 (YAML 1.1 digit
  # separators) and would match no unit at all.
  #
  # These three flags are a no-op FOR LOKEY SPECIFICALLY — locator.py already
  # hardcodes all of them: "lokey"/"lokey-client" are in _WATCHDOG_SERVICES
  # (= essential) and in _PINNED_NAMES (= stationary, and dedup-exempt).
  # Written out so the policy file states the intent rather than relying on
  # the hardcoded floor.
  #
  # There is deliberately no "restart when stopped" key here. Nothing in
  # locator.py reads one; load_policy() copies exactly seven keys out of each
  # entry (location_type, deployment_type, units, instances, project_dir,
  # git_remote, env) and silently drops everything else. Restart-on-stop has
  # to be implemented before it can be configured.
  lokey:
    deployment_type: essential
    location_type: stationary
    units: "3_4_5_6_7_8_9"
    instances: 1

  # ── Idle auto-stop ─────────────────────────────────────────────────────
  # Both live on unit4 and are why its disk keeps filling: ollama holds model
  # blobs, and the pair of them are what get stopped by hand whenever the box
  # runs short. Declaring it here makes that automatic instead of manual.
  #
  # deployment_type MUST NOT be essential — locator refuses idle_stop on an
  # essential service even when the flag is set. Neither name appears in
  # lokey NEVER_STOP (substring match), so this policy is the only gate.
  #
  # CAVEAT: neither has a wake-on-request path. Sablier runs on unit8 and
  # cannot start a container on unit4, so once these stop they stay stopped
  # until someone starts them or POSTs /api/idle/wake/<container>.
  ollama:
    deployment_type: optional
    location_type: stationary
    units: "4"
    instances: 1
    idle_stop: true
    idle_timeout: 15m
    # No trigger of its own: nothing routes to ollama through Traefik, so no
    # request can ever wake it directly. It comes up via wake_with on the two
    # services that call it — which is precisely the CAVEAT noted above.
    public_wake: true

  agent-0:
    deployment_type: optional
    location_type: stationary
    units: "4"
    instances: 1
    idle_stop: true
    idle_timeout: 15m
    public_wake: true
    wake_with: [ollama]
    wake_triggers:
      domain:
        - a0.theofficialblacksheepco.online

  # rasa lives on unit8, not unit4. Wake-on-request is wired in unit8s Traefik
  # (dynamic-config/rasa.yml) and starts rasa AND ollama, since rasa reaches
  # ollama directly rather than through a proxy.
  rasa:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    idle_stop: true
    idle_timeout: 15m
    public_wake: true
    wake_with: [ollama]
    wake_triggers:
      domain:
        - rasa.theofficialblacksheepco.online

  # ── Wake-on-request ────────────────────────────────────────────────────
  # The other half of idle auto-stop above. Everything that STARTS a container
  # for a visitor is declared here, because it used to be spread across Traefik
  # query strings, frontend constants and card props with no single file saying
  # what the truth was — and it rotted exactly the way that invites: a welcome
  # card still pointing at a hostname retired 2026-08-14, a Traefik router that
  # vanished with its own container so nothing could route a wake, and a wake
  # endpoint gated at CLIENT that answered every anonymous visitor with
  # "insufficient clearance". None of those failed loudly.
  #
  # public_wake:    STRICTLY OPT-IN, same as idle_stop. Lets an anonymous
  #                 visitor wake THIS container and nothing else. What they get
  #                 is one verb — queue a start for a container already in the
  #                 registry — and no registry data comes back.
  # wake_with:      dependencies started alongside it, so a caller asks for one
  #                 name and locator expands it. A Traefik file should never
  #                 have to know that reech has a database.
  # wake_triggers:  WHAT causes the wake, by kind. `domain:` is a hostname whose
  #                 visit should wake it; `link:` is a named link in one of our
  #                 own frontends. Served back over /api/wake/triggers so a page
  #                 asks which container its link wakes instead of hardcoding a
  #                 name nobody updates. New kinds need no code change.

  # The Ecosystem Hub SPA on unit4, published on the tailnet at :8091 and
  # fronted by unit8's Traefik. Stopped cleanly on 2026-09-02 and stayed down
  # for 31 hours, during which welcome.theofficialblacksheepco.com served a bare
  # 502 - nothing was watching, and nothing could bring it back, because it had
  # no wake policy at all. It does now: the same errors-middleware path forge
  # and rasa use, which is the one mechanism that works when the container a
  # visitor actually asked for is the one that is down.
  welcome-hub:
    deployment_type: optional
    location_type: stationary
    units: "4"
    instances: 1
    public_wake: true
    wake_triggers:
      domain:
        - welcome.theofficialblacksheepco.com

  forge:
    deployment_type: non-essential
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true
    # Idle-stopped after 15m of no traffic. Safe to do here and not elsewhere
    # because forge is the one service with a COMPLETE wake path: a file-defined
    # router in unit8's forge.yml that survives the container, an errors
    # middleware on it, and public_wake below — so a visitor's own request
    # brings it back. Its compose sets restart:"no" for the same reason; a
    # restart policy would resurrect it behind the idle policy's back.
    # deployment_type stays 'optional': locator refuses idle_stop outright on an
    # essential service, and forge is not one.
    idle_stop: true
    idle_timeout: 15m
    # /pad and /view are a separate container that stops independently —
    # 2026-08-28 took down both, and waking only forge left those two prefixes
    # dead. Naming it here means one /wake/forge starts the pair, and it also
    # keeps the welcome-hub trigger below unambiguous: /api/wake/triggers
    # returns the FIRST container declaring a match, so two containers sharing
    # a domain would make the second unreachable through the trigger map.
    wake_with: [forge-relay]
    wake_triggers:
      domain:
        - forge.prime-quality.online
        # The welcome hub pre-warms forge on page load, so the card is live by
        # the time it is clicked. This is a SECOND, independent path from the
        # hub's own wake below: the errors middleware can only ever wake the
        # container the visitor asked for, and forge is a different one on a
        # different unit. So the hub's page calls /__wake/forge itself once it
        # has rendered; see welcome-hub.yml on unit8.
        - welcome.theofficialblacksheepco.com
      link:
        - welcome:forge

  # The pad relay behind /pad and /view. A separate container, stopped
  # independently — 2026-08-28 took down both, and waking only forge would
  # still have left those two prefixes dead.
  forge-relay:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true
    wake_triggers:
      domain:
        # Its own 502 path stays: forge.yml gives /pad and /view a middleware
        # of their own, so a request straight to a stopped relay still wakes it.
        # The hub pre-warm reaches it via forge's wake_with, not from here.
        - forge.prime-quality.online

  # The search backend behind the main site's search bar. Its Postgres holds
  # the index on local disk, hence stationary, and is named in wake_with
  # because a search app with a stopped database answers 500, not "starting".
  searchsearcher-app:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true
    wake_with: [searchsearcher-postgres]
    wake_triggers:
      domain:
        - search.theofficialblacksheepco.com
        - www.theofficialblacksheepco.com
        - theofficialblacksheepco.com
      link:
        - welcome:search

  searchsearcher-postgres:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true

  # Reech, behind the client portal.
  #
  # Traefik terminates on reech-oauth, NOT on reech: routing straight to
  # reech:3000 left real mail, call logs and Matrix readable by anyone who knew
  # the hostname, which is why that was changed on 2026-08-21. So the container
  # a visitor's 502 comes from is reech-oauth, while the container they actually
  # want is reech — the two name each other here so either entry point brings
  # up both. The expansion is one level deep, so this is not a loop.
  #
  # There is no reech-db: reech uses the SHARED postgres on unit8, which is
  # essential and always up. The reech-db record still in the registry is a
  # leftover and is not a container that exists.
  reech:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true
    wake_with: [reech-oauth]
    wake_triggers:
      link:
        - welcome:reech
        - client-portal:enter

  reech-oauth:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true
    wake_with: [reech]
    wake_triggers:
      domain:
        - reech.prime-quality.online
