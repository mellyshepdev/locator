# Service policy. Read by the locator on every change (no restart needed).
#
# location_type:  stationary = never migrate. Use for anything holding data on
#                 local disk, since migration moves the compose file and NOT the
#                 volume — a "moved" database arrives empty while the only copy
#                 stays behind.
#                 mobile = may be rebalanced between units.
# deployment_type: essential | optional  (informational)
# units:          current_unit (default) | all | 8 | "7_8_9"
#                 ALWAYS QUOTE the underscore form — YAML 1.1 treats
#                 underscores as digit separators, so a bare 7_8_9 parses as
#                 the integer 789 and the policy silently matches nothing.
# instances:      how many per unit (default 1)
# project_dir /
# git_remote:     opt in to placement enforcement. Without one of these the
#                 locator will NOT fan a service out, because a queued deploy
#                 carries only a container name and the target would have
#                 nothing to check out.
# env:            .env values for the target ('common' + per-unit override).
#                 lokey merges them and never overwrites an existing key.

Service:
  # ── Stationary: hold data on local disk ────────────────────────────────
  mariadb-11.4:
    deployment_type: essential
    location_type: stationary
    units: "7_8"
    instances: 1
    restart_when_stopped: true

  mariadb-pdns:
    deployment_type: essential
    location_type: stationary
    units: "9"
    instances: 1

  postgres:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  comms-postgres:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  # Not in _PINNED_NAMES and had no locator.yml entry at all until now — the
  # exact same unprotected shape as the mariadb-11.4 incident (2026-08-09,
  # see BALANCE_ENABLED history): local vault DB, migration moves the compose
  # file but not the volume, so a migrate would orphan the real vault data.
  vaultwarden:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  postgres-inventory-backup:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1

  matomo-db:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  synapse:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  chatwoot-rails:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  # ── Stationary: bound to a unit's identity or network position ─────────
  # ── DNS + reverse proxy: the fleet's front door ────────────────────────
  # Filled out 2026-08-28. Verified live against every unit on that date:
  #   unit8  pdns, mariadb-pdns-primary, dnsdist, traefik, traefik-certs-dumper
  #   unit7  traefik
  #   unit9  pdns, mariadb-pdns-replica9, mariadb-pdns
  #
  # Every entry here is stationary AND carries a units: list that names each
  # unit it really runs on. Both matter, for different reasons:
  #   - stationary keeps the rebalancer from moving a compose file away from
  #     the volume holding the zone data.
  #   - units: is what _is_multi_unit_service() reads, and that is the ONLY
  #     thing that exempts a service from _enforce_dedup. traefik was declared
  #     units: "8" while a second traefik has been running on unit7 for days,
  #     which is exactly the shape that produced the nasa eviction loop above.
  #
  # QUOTE every underscore form. A bare 8_9 is the integer 89 (YAML 1.1 digit
  # separators) and matches no unit at all.
  # ── Control plane, identity and secrets — never migratable ────────────
  # Added 2026-09-11: these were ONLINE but undeclared, which left them
  # migratable and — for the multi-unit ones — exposed to dedup eviction.
  # locator dying mid-migration strands the whole fleet; the lokeys execute
  # every queued command, so stopping one blinds that unit entirely.

  locator:
    deployment_type: essential
    location_type: stationary
    units: "4"
    instances: 1

  # One per reporting unit — the agents that run the command queue.
  lokey-client:
    deployment_type: essential
    location_type: stationary
    units: "3_4_5_8_9"
    instances: 1

  # SSO. One node per unit, a cluster by design - units lists all three so
  # _is_multi_unit_service() keeps dedup from "cleaning up" two of them.
  keycloak:
    deployment_type: essential
    location_type: stationary
    units: "4_7"
    instances: 1

  # Fleet PKI / secrets broker. Mints the mTLS leaves everything else uses.
  openbao:
    deployment_type: essential
    location_type: stationary
    units: "4"
    instances: 1

  # Kerberos/LDAP identity for the fleet.
  freeipa:
    deployment_type: essential
    location_type: stationary
    units: "4"
    instances: 1

  # ── Edge + state services — pinned 2026-09-11 ─────────────────────────
  # unit4's front-of-house pair: varnish caches in front of apache, haproxy
  # terminates/steers on :443-adjacent paths. Both are bound to unit4 by the
  # routes that point at them.
  varnish:
    deployment_type: essential
    location_type: stationary
    units: "4"
    instances: 1

  varnish-log:
    deployment_type: essential
    location_type: stationary
    units: "4"
    instances: 1

  haproxy:
    deployment_type: essential
    location_type: stationary
    units: "4"
    instances: 1

  # The redis HA set on unit7: primary + 2 replicas + 3 sentinels, one
  # failure domain by design. Sentinels hold quorum state, replicas hold
  # data — moving any one of them splits the cluster's brain.
  redis-ha-primary:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1

  redis-ha-replica-1:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1

  redis-ha-replica-2:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1

  redis-ha-sentinel-1:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1

  redis-ha-sentinel-2:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1

  redis-ha-sentinel-3:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1

  # ── unit7 databases — pinned 2026-09-15 ───────────────────────────────
  # Found ONLINE on unit7 with no policy entry, so the balancer saw them as
  # movable: none match _PINNED_NAMES ("pgdb" is not "postgres", cockroach and
  # the wazuh OpenSearch indexer are not listed at all). pgdb-18.3 is the
  # inventory source of truth. Migration moves the compose file and NOT the
  # volume, so every one of these would have arrived empty.
  #
  # restart_when_stopped: lokey's keep_alive() starts the container whenever
  # unit7 is up and it is found stopped - including after a deliberate
  # docker stop, which an unless-stopped restart policy never comes back from.

  pgdb-18.3:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1
    restart_when_stopped: true

  pgdb2-18.3:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1
    restart_when_stopped: true

  liv-log-pgdb-18.3:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1
    restart_when_stopped: true

  live-logger-db:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1
    restart_when_stopped: true

  lago-db:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1
    restart_when_stopped: true

  lago-redis:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1
    restart_when_stopped: true

  puffbase-cockroach:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1
    restart_when_stopped: true

  wazuh-indexer:
    deployment_type: essential
    location_type: stationary
    units: "7"
    instances: 1
    restart_when_stopped: true

  traefik:
    deployment_type: essential
    location_type: stationary
    units: "7_8"
    instances: 1

  # Writes the ACME cert bundle out of acme.json for the services that read
  # PEMs off disk. Bound to unit8 because that is where acme.json lives.
  traefik-certs-dumper:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  # Authoritative DNS. unit8 is primary, unit9 is the AXFR secondary - both
  # answer on :53, so losing either is a real outage, not a degraded read.
  pdns:
    deployment_type: essential
    location_type: stationary
    units: "8_9"
    instances: 1

  # pdns's backing store. These are NOT interchangeable: the primary holds the
  # writable copy that pdnsutil edits, the replica9 copy is fed by replication.
  # Migrating either moves the compose file and leaves the volume behind.
  mariadb-pdns-primary:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  mariadb-pdns-replica9:
    deployment_type: essential
    location_type: stationary
    units: "9"
    instances: 1

  # The :53 front end on unit8 that fans queries out to pdns.
  dnsdist:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  # The two public web front doors. Both are bound to unit8 by an A record in
  # pdns and by Traefik's file provider, so a migration would move the compose
  # file while DNS kept pointing here — the site would simply go dark.
  # The Keycloak DB is a pg_auto_failover PAIR, one node on unit4 and one on
  # unit8 -- KC_DB_URL lists both :5435 endpoints and jdbc-ping discovers the
  # Keycloak peers THROUGH it. Without this entry the duplicate_killer read the
  # second node as a stray copy and queued a dedup eviction every ~4 minutes
  # ("DEDUP: kc-pg-node duplicated on unit4, keeping unit8"); 6 fired on
  # 2026-09-04 and every one failed. Had one succeeded it would have taken out
  # half the cluster behind SSO.
  # stationary because it holds data on local disk: migration moves the compose
  # file and NOT the volume.
  kc-pg-node:
    deployment_type: essential
    location_type: stationary
    units: "4_7_8"
    instances: 1

  main-site-apache:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  # unit4s public Apache front door. unit8 Traefik upstreams tech-estate and
  # friends to 100.82.31.92:8080 and the docroot lives on /mnt/omv_storage, so
  # a migration strands the route AND the content. No policy entry meant it
  # was migratable - found exposed 2026-09-11 while auditing the pin set.
  apache:
    deployment_type: essential
    location_type: stationary
    units: "4"
    instances: 1
    # The unit4-published web stack (aegis / -apache / tech-estate / error-pages
    # routers on the edge). Edges reach it as apache@http so a migration moves
    # the upstream with the registry instead of stranding a hardcoded tailnet IP.
    edge_port: 8080

  # Same backend as apache — a second emitted service only because the edge's
  # errors middleware needs passHostHeader off while every sibling router wants
  # the default. edge_host points the placement lookup at apache's registry
  # entry; no container named error-pages ever exists.
  error-pages:
    edge_host: apache
    edge_port: 8080
    edge_pass_host: false

  # aegis-server (mfa.theofficialblacksheepco.com) — real container, keeps the
  # /healthz probe its file service always had.
  aegis-server:
    edge_port: 8090
    edge_healthcheck: /healthz

  # The public store is separate from the main site so it can be migrated
  # independently and stopped when it has been idle for 15 minutes.
  store-site:
    deployment_type: optional
    location_type: mobile
    units: "8"
    instances: 1
    idle_stop: true
    idle_timeout: 15m
    public_wake: true
    project_dir: /home/swoopg111/server/networking/store-site
    wake_triggers:
      domain:
        - theofficialblacksheepco.com
        - www.theofficialblacksheepco.com
        - theofficialblacksheepco.store
        - www.theofficialblacksheepco.store


  # ── STOP-GAP, added 2026-08-23 ─────────────────────────────────────────
  # nasa is ONLINE on unit7 AND unit9, so _enforce_dedup tried to evict the
  # unit7 copy with a git_push_and_stop every ~90s. It failed every time —
  # unit7's nasa was started with `docker run`, not compose, so it carries no
  # com.docker.compose.* labels and lokey cannot find a project dir to push.
  # A FAILED dedup migration no longer blocks the next one, so it relaunched
  # forever: 147 failures between 20:48 and 01:00.
  #
  # Declaring both units is what actually stops it. location_type: stationary
  # does NOT — _enforce_dedup only exempts via _PINNED_NAMES or
  # _is_multi_unit_service(), and the latter reads THIS field.
  #
  # This is deliberately NOT the end state: nasa is meant to be migratable.
  # To get there, give it a real compose project on unit7 (a docker-compose.yml
  # + `docker compose up -d` so the labels exist), add project_dir/git_remote
  # here, then narrow units back to one. Until the labels exist, no migration
  # of nasa can ever succeed.
  #
  # QUOTED on purpose: YAML 1.1 reads a bare 7_9 as the integer 79.
  nasa:
    deployment_type: non-essential
    location_type: mobile
    units: "7_9"
    instances: 1

  # ── Fleet-wide log shipper (live-logger) ───────────────────────────────
  # Added 2026-08-23. Both were stopped and stayed stopped: fluent-bit is
  # restart: unless-stopped and had been deliberately SIGTERMed, which that
  # policy never recovers from, and container-names is restart: "no", so any
  # kill is permanent.
  #
  # deployment_type: essential is set here but is NOT protection today. Tested
  # 2026-08-23: policy loaded, the registry correctly saw
  # live-logger-container-names@unit9 go OFFLINE, and
  # nothing queued a start in 5 minutes. restart_when_stopped (lokey keep_alive)
  # is what brings them back now. Treat any other essential service
  # as unsupervised until that is fixed; the flag only drives the grid badge.
  #
  # units MUST be present and MUST be quoted. Without it
  # _is_multi_unit_service() is false and _enforce_dedup treats the per-unit
  # shippers as duplicates and evicts all but one — the exact loop that
  # bug #6 fixed. A bare 4_7_8_9 is the integer 4789 (YAML 1.1 digit
  # separators) and matches no unit at all.
  #
  # stationary because fluent_bit_state holds this unit's tail read-offsets
  # and retry buffer, and migration moves the compose file, not the volume.
  fluent-bit:
    deployment_type: essential
    location_type: stationary
    units: "4_7_8_9"
    instances: 1
    restart_when_stopped: true

  live-logger-container-names:
    deployment_type: essential
    location_type: stationary
    units: "4_7_8_9"
    instances: 1
    restart_when_stopped: true

  # ── lokey — the host agent, every unit ─────────────────────────────────
  # Added 2026-08-23.
  #
  # QUOTED: a bare 3_4_5_6_7_8_9 is the integer 3456789 (YAML 1.1 digit
  # separators) and would match no unit at all.
  #
  # These three flags are a no-op FOR LOKEY SPECIFICALLY — locator.py already
  # hardcodes all of them: "lokey"/"lokey-client" were in _WATCHDOG_SERVICES (removed 2026-09-15)
  # (= essential) and in _PINNED_NAMES (= stationary, and dedup-exempt).
  # Written out so the policy file states the intent rather than relying on
  # the hardcoded floor.
  #
  # There is deliberately no "restart when stopped" key here. Nothing in
  # locator.py reads one; load_policy() copies exactly seven keys out of each
  # entry (location_type, deployment_type, units, instances, project_dir,
  # git_remote, env) and silently drops everything else. Restart-on-stop has
  # to be implemented before it can be configured.
  lokey:
    deployment_type: essential
    location_type: stationary
    units: "3_4_5_6_7_8_9"
    instances: 1

  # ── Idle auto-stop ─────────────────────────────────────────────────────
  # deployment_type MUST NOT be essential — locator refuses idle_stop on an
  # essential service even when the flag is set. agent-0 does not appear in
  # lokey NEVER_STOP (substring match), so this policy is the only gate.
  #
  # LLM backend (2026-09-15): every AI consumer
  # (agent-0, forge) uses llama.cpp — llama-server on unit7 (:8085 coder,
  # :8086 vision) with ggml rpc-server workers on unit4 and unit8. Those run
  # under systemd, not Docker, and are never idle-stopped, so nothing needs
  # to be woken alongside a consumer.
  agent-0:
    deployment_type: optional
    location_type: stationary
    units: "4"
    instances: 1
    idle_stop: true
    idle_timeout: 15m
    public_wake: true
    wake_triggers:
      domain:
        - a0.theofficialblacksheepco.online

  # rasa lives on unit8, not unit4. Wake-on-request is wired in unit8s Traefik
  # (dynamic-config/rasa.yml). Its answers come from site-chat (Azure); when
  # that cannot answer, the customer is told staff will reply in the chat.
  rasa:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1
    # idle_stop DISABLED 2026-09-04. rasa now backs the live customer chat on
    # the website (widget -> Chatwoot -> webhook-relay -> rasa -> site-chat).
    # webhook-relay calls http://rasa:5005 over the docker network, which never
    # touches Traefik, so the wake_triggers domain below can never fire for a
    # real customer. Result: the visitor who woke it got no answer at all.
    # A live chat backend cannot cold-start on the customers dime.
    idle_stop: false
    idle_timeout: 15m
    public_wake: true
    wake_triggers:
      domain:
        - rasa.theofficialblacksheepco.online

  # ── Communication stack — all unit8, all pinned 2026-09-11 ────────────
  # The customer-chat chain is widget -> Chatwoot -> webhook-relay -> rasa ->
  # site-chat; break any link and the site chat goes dark. mailserver/mail-admin
  # run the domain's mail; synapse/element/matrix-relay are the Matrix homeserver
  # trio. Migrating any of these strands credentials, volumes and DNS MX/A.
  chatwoot-sidekiq:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  webhook-relay:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  rasa-actions:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  mailserver:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  mail-admin:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  matrix-relay:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  element:
    deployment_type: essential
    location_type: stationary
    units: "8"
    instances: 1

  # ── Wake-on-request ────────────────────────────────────────────────────
  # The other half of idle auto-stop above. Everything that STARTS a container
  # for a visitor is declared here, because it used to be spread across Traefik
  # query strings, frontend constants and card props with no single file saying
  # what the truth was — and it rotted exactly the way that invites: a welcome
  # card still pointing at a hostname retired 2026-08-14, a Traefik router that
  # vanished with its own container so nothing could route a wake, and a wake
  # endpoint gated at CLIENT that answered every anonymous visitor with
  # "insufficient clearance". None of those failed loudly.
  #
  # public_wake:    STRICTLY OPT-IN, same as idle_stop. Lets an anonymous
  #                 visitor wake THIS container and nothing else. What they get
  #                 is one verb — queue a start for a container already in the
  #                 registry — and no registry data comes back.
  # wake_with:      dependencies started alongside it, so a caller asks for one
  #                 name and locator expands it. A Traefik file should never
  #                 have to know that reech has a database.
  # wake_triggers:  WHAT causes the wake, by kind. `domain:` is a hostname whose
  #                 visit should wake it; `link:` is a named link in one of our
  #                 own frontends. Served back over /api/wake/triggers so a page
  #                 asks which container its link wakes instead of hardcoding a
  #                 name nobody updates. New kinds need no code change.
  # edge_port:      the tailnet port this service publishes on its hosting
  #                 unit. /api/traefik turns it into a Traefik service upstream
  #                 (http://<hosting unit's tailnet IP>:<edge_port>) that edges
  #                 poll, so a migration moves the route with the registry —
  #                 no file edit on any edge. The service is ALWAYS emitted:
  #                 when the host cannot be resolved it points at a dead
  #                 placeholder, which 502s into the wake middleware instead of
  #                 dropping the router and the wake path with it.

  # The Ecosystem Hub SPA on unit4, published on the tailnet at :8091 and
  # fronted by unit8's Traefik. Stopped cleanly on 2026-09-02 and stayed down
  # for 31 hours, during which welcome.theofficialblacksheepco.com served a bare
  # 502 - nothing was watching, and nothing could bring it back, because it had
  # no wake policy at all. It does now: the same errors-middleware path forge
  # and rasa use, which is the one mechanism that works when the container a
  # visitor actually asked for is the one that is down.
  welcome-hub:
    deployment_type: optional
    location_type: stationary
    units: "4"
    instances: 1
    public_wake: true
    # Tailnet publish port edges reach this on; /api/traefik follows it, so the
    # hub can move off its current unit without a file edit on the edge.
    edge_port: 8091
    wake_triggers:
      domain:
        - welcome.theofficialblacksheepco.com

  forge:
    # Tailnet publish port edges reach this on; /api/traefik follows it.
    edge_port: 8090
    deployment_type: non-essential
    location_type: stationary
    units: "7"
    instances: 1
    public_wake: true
    # Idle-stopped after 15m of no traffic. Safe to do here and not elsewhere
    # because forge is the one service with a COMPLETE wake path: a file-defined
    # router in the edge's forge.yml that survives the container, an errors
    # middleware on it, and public_wake below — so a visitor's own request
    # brings it back. Its compose sets restart:"no" for the same reason; a
    # restart policy would resurrect it behind the idle policy's back.
    # deployment_type stays 'optional': locator refuses idle_stop outright on an
    # essential service, and forge is not one.
    idle_stop: true
    idle_timeout: 15m
    # /pad and /view are a separate container that stops independently —
    # 2026-08-28 took down both, and waking only forge left those two prefixes
    # dead. Naming it here means one /wake/forge starts the pair, and it also
    # keeps the welcome-hub trigger below unambiguous: /api/wake/triggers
    # returns the FIRST container declaring a match, so two containers sharing
    # a domain would make the second unreachable through the trigger map.
    wake_with: [forge-relay]
    # The same relationship, for migration rather than wake. App.tsx opens
    # `wss://${window.location.host}/view/default` — the pad relay, reached on
    # forge's OWN hostname through the /pad and /view routers in the edge's
    # forge.yml. So the tablet cursor is dead whenever forge-relay is not
    # running, and moving forge to a unit where it is absent ships a half-broken
    # app. This is forge's only real dependency: the card editor makes no other
    # backend call of any kind, and the segmentation assets come from a CDN.
    #
    # Bare name, not forge-relay@unit8, deliberately — the relay only has to be
    # up SOMEWHERE, since it is reached over the tailnet like everything else.
    depends_on: [forge-relay]
    wake_triggers:
      domain:
        - forge.prime-quality.online
        # The welcome hub pre-warms forge on page load, so the card is live by
        # the time it is clicked. This is a SECOND, independent path from the
        # hub's own wake below: the errors middleware can only ever wake the
        # container the visitor asked for, and forge is a different one on a
        # different unit. So the hub's page calls /__wake/forge itself once it
        # has rendered; see welcome-hub.yml on the edge.
        - welcome.theofficialblacksheepco.com
      link:
        - welcome:forge

  # The pad relay behind /pad and /view. A separate container, stopped
  # independently — 2026-08-28 took down both, and waking only forge would
  # still have left those two prefixes dead.
  forge-relay:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true
    # Tailnet publish port; the /pad and /view routers reach it as
    # forge-relay@http so its upstream follows the registry on a migration
    # instead of staying glued to whichever edge it happened to share.
    edge_port: 8791
    wake_triggers:
      domain:
        # Its own 502 path stays: forge.yml gives /pad and /view a middleware
        # of their own, so a request straight to a stopped relay still wakes it.
        # The hub pre-warm reaches it via forge's wake_with, not from here.
        - forge.prime-quality.online

  # The search backend behind the main site's search bar. Its Postgres holds
  # the index on local disk, hence stationary, and is named in wake_with
  # because a search app with a stopped database answers 500, not "starting".
  searchsearcher-app:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    # Idle-stops after 15m of no traffic; a visitor to the main site, the
    # welcome page, or search.theofficialblacksheepco.com itself wakes it.
    # Only the app carries idle_stop: searchsearcher-postgres matches the
    # "postgres" entry in _PINNED_NAMES in locator.py, so its idle reports are
    # dropped and it would never be reaped anyway — and the app answers 500,
    # not "starting", if its database is down (which is why it is wake_with).
    # project_dir+git_remote make it deployable, which is only safe alongside
    # idle_stop because placement skips entries flagged idle_stopped — that
    # guard did not exist before 2026-09-14 and store-site looped on it.
    idle_stop: true
    idle_timeout: 15m
    public_wake: true
    project_dir: /home/swoopg111/projects/searchsearcher
    git_remote: git@github.com:mellyshepdev/searchsearcher.git
    wake_with: [searchsearcher-postgres]
    wake_triggers:
      domain:
        - search.theofficialblacksheepco.com
        - www.theofficialblacksheepco.com
        - theofficialblacksheepco.com
      link:
        - welcome:search
        # The apex/www domains are ALSO declared by store-site, which sits
        # earlier in this file, and /api/wake/triggers returns the first
        # match — so the main site's domain lookup resolves to the store.
        # main:search gives its wake.js a trigger that cannot be shadowed.
        - main:search

  searchsearcher-postgres:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true

  # Reech, behind the client portal.
  #
  # Traefik terminates on reech-oauth, NOT on reech: routing straight to
  # reech:3000 left real mail, call logs and Matrix readable by anyone who knew
  # the hostname, which is why that was changed on 2026-08-21. So the container
  # a visitor's 502 comes from is reech-oauth, while the container they actually
  # want is reech — the two name each other here so either entry point brings
  # up both. The expansion is one level deep, so this is not a loop.
  #
  # There is no reech-db: reech uses the SHARED postgres on unit8, which is
  # essential and always up. The reech-db record still in the registry is a
  # leftover and is not a container that exists.
  reech:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true
    wake_with: [reech-oauth]
    wake_triggers:
      # Visiting the client portal wakes reech, because the portal Messages tab
      # fetches reech cross-origin - by the time that fetch runs, a stopped
      # reech is a network error the portal cannot tell apart from "signed out".
      # The portal itself is always up and answers 200, so no errors middleware
      # can ever fire on that host: the portal page asks for this wake itself
      # via /__wake/ (see client-portal.yml on unit8, and WAKE.md item 2).
      domain:
        - portal.theofficialblacksheepco.com
      link:
        - welcome:reech
        - client-portal:enter

  reech-oauth:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true
    wake_with: [reech]
    wake_triggers:
      domain:
        - reech.prime-quality.online

  # ── Ops dashboard (ops.theofficialblacksheepco.com) ─────────────────────
  # The dashboard itself is always-up (restart: unless-stopped, no idle_stop),
  # so its wake policy exists almost entirely to PRE-WARM the tools its cards
  # open. The page calls /__wake/triggers?domain=ops…, gets this entry back,
  # then /__wake/ops-dashboard expands wake_with server-side — pgAdmin plus the
  # three inventory backends. Container names stay out of the page: a rename or
  # a move is a policy edit here, not a rebuild of the dashboard.
  ops-dashboard:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true
    wake_with: [pgadmin_ui, inventory-server, inventory-api, inventory-inventory-1]
    wake_triggers:
      domain:
        - ops.theofficialblacksheepco.com
      link:
        - welcome:scanner

  # Sablier stops pgAdmin 30m after its last proxied request; a wake only
  # STARTS it (docker start), it does not fight that schedule. Stationary on
  # unit8 because the edge reaches it by docker-network name, not tailnet.
  pgadmin_ui:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true

  # scanner.theofficialblacksheepco.online backend — the web scanner page and
  # the Inventory Backend 1 card both land here.
  inventory-server:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true

  # inventory-api.theofficialblacksheepco.online — Inventory Backend 2.
  inventory-api:
    deployment_type: optional
    location_type: stationary
    units: "8"
    instances: 1
    public_wake: true

  # The Vite/React inventory app on unit7 (inventory.theofficialblacksheepco.
  # online). Its edge file routes to a tailnet-published 8082.
  inventory-inventory-1:
    deployment_type: optional
    location_type: stationary
    units: "7"
    instances: 1
    public_wake: true

  # The edge's name for that app — borrows the container's registry placement
  # so inventory-app.yml can point at inventory-app@http and follow a move.
  inventory-app:
    edge_host: inventory-inventory-1
    edge_port: 8082

  # Tikur Bego — luxury landing page on unit7 (pro-pieces.prime-quality.online).
  # Static Vite/React build behind nginx, tailnet-published at :8094; the edge
  # file pro-pieces.yml routes to pro-pieces@http and follows a move.
  pro-pieces:
    deployment_type: optional
    location_type: stationary
    units: "7"
    instances: 1
    public_wake: true
    edge_port: 8094
    git_remote: https://gitlab.com/gbonds1/pro-pieces.git
    wake_triggers:
      domain:
        - pro-pieces.prime-quality.online
