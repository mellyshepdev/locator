app = "tobsco-locator"
primary_region = "iad"

[build]

[env]
  UNIT_NAME    = "fly"
  LOCATOR_PORT = "5000"

[http_service]
  internal_port        = 5000
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
