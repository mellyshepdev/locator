# locator-ui — static dashboard shell in front of the Flask API.
#
# Traefik sends every locator.prime-quality.online request that is NOT an
# explicit API path here (the locator-api router, priority 200, still lands
# /api/, /nodes/, /wake/ etc. straight on the locator container — so stopping
# THIS container only takes the HTML pages down, never the API).
#
# Statics resolve from the bind-mounted templates/ dir read per-request —
# dashboard.html edits go live without any restart. Everything that is not a
# real file proxies to the Flask app, preserving /register-device, /3d-mesh,
# /registry.json, /services, /trigger-* and friends exactly as before.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index dashboard.html;

    location / {
        try_files $uri $uri.html $uri/ @api;
    }

    location @api {
        proxy_pass http://locator:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
