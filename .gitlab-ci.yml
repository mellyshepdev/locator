stages:
  - deploy

variables:
  PROJECT_DIR: /home/swoopg111/projects/locator

# Deploy locator to unit4 on every push to main
deploy:unit4:
  stage: deploy
  tags:
    - unit4          # only runs on the runner registered on unit4
  only:
    - main
  script:
    - cd $PROJECT_DIR
    - git pull origin main
    - docker compose up -d --build
    - docker image prune -f
  environment:
    name: production
    url: https://locator.theofficialblacksheepco.online
