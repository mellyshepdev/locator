Service:

  # 2026-10-13: PuffBase runs on puffbase-vm (unit9 haproxy be_puffbase/be_git/
  # be_puffapp -> puffbase-vm.prime-quality.online). This unit4 stanza is kept
  # only as a record: optional and never auto-restarted, so lokey on unit4
  # stops redeploying it from the leftover ~/server/puffbase (exit 78 loop).

  # puff-base.com — the site-builder app on unit7; edge file puff-base.yml
  # routes to it. Same name as the compose project that also runs
  # puffbase-cockroach/-crew/-userdash/-runner — this stanza covers only the
  # `puffbase` web container.
  # Essential per owner 2026-09-19: never idle-stopped or power-drained,
  # auto-revived by lokey keep_alive if it dies.
  puffbase:
    deployment_type: optional
    location_type: mobile
    units: "4"
    instances: 1
    idle_stop: false
    restart_when_stopped: false
    public_wake: false
    project_dir: /home/swoopg111/server/puffbase
    wake_triggers:
      domain:
        - puff-base.com
        - www.puff-base.com
