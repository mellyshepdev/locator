Service:

  # theofficialblacksheepco.com — the main site, apache. The older
  # main-site-apache stanza names the retired unit8 container and never
  # matched this name, so it ran unprotected. Essential per owner 2026-10-11:
  # never idle-stopped or drained, auto-revived if it dies. Migratable
  # between unit2 and unit7 per owner 2026-09-24 — a loaded unit7 must not
  # trap it; project_dir exists on both units.
  main-website:
    deployment_type: essential
    location_type: mobile
    units: "2_7"
    instances: 1
    # Apache publishes <unit tailnet IP>:8217:80 on whichever unit hosts it
    # (compose pins the same port on unit2 + unit7). Without edge_port the
    # /api/traefik feed emits no main-website service and Traefik's file
    # routers that reference main-website@http (incl. the /api/products.json
    # exception) silently drop — the store grid then fetches a 404.
    edge_port: 8217
    idle_stop: false
    restart_when_stopped: true
    public_wake: true
    project_dir: /home/swoopg111/projects/blackshepherddeveloper-project
    wake_triggers:
      domain:
        - theofficialblacksheepco.com
        - www.theofficialblacksheepco.com
