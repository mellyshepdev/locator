Service:

  # Essential with reech — it is the front door. A stopped reech-oauth makes
  # a running reech unreachable (this exact failure happened 2026-09-20).
  reech-oauth:
    deployment_type: essential
    location_type: stationary
    units: "4"   # runs on unit4 (unit2 was its old home; restart_when_stopped must point here)
    instances: 1
    idle_stop: false
    restart_when_stopped: true
    public_wake: true
    wake_with: [reech]
    wake_triggers:
      domain:
        - reech.prime-quality.online
