Service:

  forge:
    # Tailnet publish port edges reach this on; /api/traefik follows it.
    # 8092, not 8090: unit2 firefly owns 100.64.118.105:8090 (moved 2026-09-28)
    edge_port: 8092
    deployment_type: non-essential
    # Mobile since 2026-09-28: unit7 is chronically overloaded and forge is a
    # static Apache bundle — it belongs wherever the load isn't. units "2_7"
    # only: the compose builds a vite image on `up`, and unit9's 1GB can't
    # survive that build.
    location_type: mobile
    units: "2_7"
    instances: 1
    public_wake: true
    # Idle-stopped (owner call 2026-09-16, superseding the earlier always-on
    # pin): forge reaps after 15 idle minutes. The wake path stays armed —
    # public_wake + the file-defined router and errors middleware in the
    # edge's forge.yml — so a visitor's own request still brings it back.
    # Its compose sets restart:"no"; a restart policy would resurrect it
    # behind the idle policy's back.
    idle_stop: true
    idle_timeout: 15m
    # /pad and /view are a separate container that stops independently —
    # 2026-08-28 took down both, and waking only forge left those two prefixes
    # dead. Naming it here means one /wake/forge starts the pair, and it also
    # keeps the welcome-hub trigger below unambiguous: /api/wake/triggers
    # returns the FIRST container declaring a match, so two containers sharing
    # a domain would make the second unreachable through the trigger map.
    # forge-ai rides along too — the mastra vectorization sidecar behind
    # /api/ai on forge's host. It is never idle-stopped, but wake_with also
    # covers container recreation after a host failure.
    wake_with: [forge-relay, forge-ai]
    # The same relationship, for migration rather than wake. App.tsx opens
    # `wss://${window.location.host}/view/default` — the pad relay, reached on
    # forge's OWN hostname through the /pad and /view routers in the edge's
    # forge.yml. So the tablet cursor is dead whenever forge-relay is not
    # running, and moving forge to a unit where it is absent ships a half-broken
    # app. This is forge's only real dependency: the card editor makes no other
    # backend call of any kind, and the segmentation assets come from a CDN.
    #
    # Bare name, not forge-relay@unit8, deliberately — the relay only has to be
    # up SOMEWHERE, since it is reached over the tailnet like everything else.
    depends_on: [forge-relay]
    wake_triggers:
      domain:
        - forge.prime-quality.online
        # The welcome hub pre-warms forge on page load, so the card is live by
        # the time it is clicked — the hub's page calls /__wake/forge itself
        # once rendered (welcome-wake.yml on the edge). Do NOT re-add
        # welcome.theofficialblacksheepco.com here: /api/wake/triggers returns
        # the FIRST matching container, so claiming the hub's domain hijacks
        # its recovery wake — the edge wake page would start forge while the
        # visitor is actually waiting for welcome-hub.
      link:
        - welcome:forge
