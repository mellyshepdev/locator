Service:

  # inventory.theofficialblacksheepco.com — dedicated frontend behind the
  # shared unit7 apache :8082 proxy. The edge file still routes to :8082; only
  # the backend container changed from the retired inventory-inventory-1.
  inventory-web:
    deployment_type: optional
    location_type: stationary
    units: "7"
    instances: 1
    idle_stop: false
    idle_timeout: 15m
    public_wake: true
    project_dir: /home/swoopg111/projects/inventory
    wake_triggers:
      domain:
        - inventory.theofficialblacksheepco.com
        - scanner.theofficialblacksheepco.online
