Service:

  # inventory.theofficialblacksheepco.com — dedicated frontend. Migratable:
  # every bind mount is under /srv/clusterfs (CephFS), and the edge upstream
  # follows the registry via inventory-app@http (edge_port 8097 in
  # locator.d/inventory-app.yml), so nothing pins it to unit7 anymore.
  # units stays "current_unit" — a multi-unit spec would make
  # enforce_unit_placement fan it out to every listed unit instead of
  # keeping it a single mobile instance.
  inventory-web:
    deployment_type: non-essential
    location_type: mobile
    units: "current_unit"
    instances: 1
    idle_stop: true
    idle_timeout: 15m
    public_wake: true
    project_dir: /home/swoopg111/projects/inventory
    wake_triggers:
      domain:
        - inventory.theofficialblacksheepco.com
        - scanner.theofficialblacksheepco.online
