# locator-ui — the dashboard's own little Apache (consolidation rule: no
# nginx). Static templates/ with a proxy fallback to the Flask API for
# anything that is not a real file — same surface the old flask route gave.
#
# This container exists to be STOPPABLE: lokey reports its traffic because
# of the locator.idle.stop label, locator's reaper stops it after
# locator.d/locator-ui.yml's idle_timeout, and the shared apache on :15000
# 503s page requests while it is down — which is what trips the edge's
# wake-page flow (/wake/locator-ui -> lokey start -> back up).
# dashboard.html edits are live on the next request.
ServerRoot "/usr/local/apache2"
ServerName locator-ui
PidFile /tmp/httpd.pid

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

TypesConfig conf/mime.types

User daemon
Group daemon

ErrorLog /proc/self/fd/2
LogLevel warn
CustomLog /proc/self/fd/1 combined

Listen 80

ProxyPreserveHost On

DocumentRoot "/srv/locator"
DirectoryIndex dashboard.html

<Directory "/srv/locator">
    Require all granted
    Options -Indexes
</Directory>

RewriteEngine On
# real file or dir -> serve it
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
RewriteRule ^ - [L]
# extensionless page -> its .html (mesh -> mesh.html)
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.html -f
RewriteRule ^(.*)$ $1.html [L]
# everything else -> the Flask API
RewriteRule ^(.*)$ http://locator:5000$1 [P,L]

# Branded error pages — ship in templates/ (the docroot). 502/503/504 fire
# when the flask upstream is unreachable; a live upstream's own 5xx body
# still passes through untouched (ProxyErrorOverride stays off).
ErrorDocument 404 /404.html
ErrorDocument 500 /500.html
ErrorDocument 502 /500.html
ErrorDocument 503 /500.html
ErrorDocument 504 /500.html
