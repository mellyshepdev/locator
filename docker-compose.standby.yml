# Standalone standby locator — used by lokey's failover (_start_local_locator
# in hard-stats.py) to bring up a local locator when the canonical instance
# (tobsco-locator.fly.dev) misses LOCATOR_MISS_THRESHOLD heartbeats in a row.
#
# Unlike docker-compose.yml (which assumes the old unit1 Traefik/Keycloak
# stack), this publishes port 5000 directly and has no external network or
# reverse-proxy dependency, so it can come up standalone on any unit.
# Identity needs no configuration: locator discovers its unit name at
# runtime (Docker daemon name / /etc/hostname — _resolve_unit_name()),
# which is what lets this file come up correctly on ANY unit. UNIT_NAME
# remains only as a last-resort override.
services:
  locator:
    build: .
    container_name: locator
    restart: "no"
    ports:
      - "${LOCATOR_STANDBY_PORT:-5000}:5000"
    volumes:
      - ./registry_data:/app/data
      # Required for identity discovery (daemon name = the host's real
      # hostname) and for _stop_self()'s Docker-API path. Without it the
      # container sees only its own id in /etc/hostname and resolves
      # UNIT_NAME to "unknown".
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - UNIT_NAME=${UNIT_NAME:-}
      - LOCATOR_IS_PRIMARY=false
      - SELF_CONTAINER_NAME=locator
      - LOCATOR_CANONICAL_URL=${LOCATOR_CANONICAL_URL:-https://tobsco-locator.fly.dev}
      - DATABASE_URL=${DATABASE_URL:-}
      - LOCATOR_ADMIN_KEY=${LOCATOR_ADMIN_KEY:-}
      - PYTHONUNBUFFERED=1
