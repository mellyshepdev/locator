services:
  locator:
    build: .
    container_name: locator
    # Was restart:"no", so any crash left locator down until a human
    # noticed. That is why it stayed down for a day with no failover.
    restart: unless-stopped
    # unit4 has no Traefik of its own and its :80/:443 are NSG-blocked, so
    # unit8 Traefik reaches locator over the tailnet on this port.
    ports:
      - "50500:5000"
    volumes:
      - ./registry_data:/app/data
      - ./templates:/app/templates
      - ./locator.yml:/app/locator.yml
      # Editable from the dashboard's YAMLs tab. Without this mount the file
      # only exists inside the image, so a UI edit would be discarded on the
      # next rebuild rather than changing the deployment.
      # locator.d holds the per-service policy files, merged over locator.yml
      # by load_policy() — same reason for the mount.
      - ./locator.d:/app/locator.d
      - ./docker-compose.yml:/app/docker-compose.yml
      - /home/swoopg111/.ssh:/root/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # OpenBao broker token (read-only). Populated by setup-fleet-pki.sh and
      # gitignored. Without this mount bao.py has no token and every bao://
      # resolve and /api/certs/issue fails — which is the state before this.
      - ./secrets:/app/secrets:ro
    # Debug-level logging. Overrides the Dockerfile CMD rather than editing it, so
    # this needs no --build (locator.py/bao.py are baked into the image, but the
    # command is not). Drop back to `info` once the Varnish cutover is settled —
    # gunicorn debug is chatty and the json-file log will grow.
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "8",
              "--worker-class", "gthread", "--timeout", "300", "--keep-alive", "5",
              "--access-logfile", "-", "--error-logfile", "-", "--log-level", "debug",
              "locator:app"]
    environment:
      # Identity is discovered at runtime (/etc/hostname natively, the
      # Docker daemon name containerized) — see _resolve_unit_name() in
      # locator.py. UNIT_NAME remains only as a last-resort override for
      # hosts that name neither after their unit; do NOT hardcode a unit
      # here — a compose file that travels carries the wrong identity
      # (that exact bug made unit7's standby elect to stop itself).
      - UNIT_NAME=${UNIT_NAME:-}
      # Run the fleet refresh with the script's own debug tracing on
      # (refresh honours DEBUG=1 -> its debug() helper). Without this the
      # per-unit run logs only its "==>" milestones.
      - REFRESH_SCRIPT=DEBUG=1 REFRESH_NO_FANOUT=1 UNIT_NAME={unit} "$$HOME/.local/bin/refresh"
      - COMPOSE_DIR=/app/data/compose
      - BALANCE_HIGH=65
      - BALANCE_DIFF=5
      - BALANCE_STRIKES=2
      - BALANCE_COOLDOWN=300
      - OOM_THRESHOLD=90
      # Heartbeat grace. The default is 90s against lokey TICK_RATE=60 — only
      # 30s of slack. A unit sends its OWN heartbeat first, then registers each
      # container in a SEQUENTIAL loop, one POST per container at timeout=5.
      # On unit8 (52 containers, 100+ round trips) a handful of slow calls
      # pushes that loop past 90s, so every container the loop had not reached
      # yet went stale and the reaper marked it OFFLINE — then the next tick put
      # it back. That is the endless "OFFLINE: <container>@unit8" with the unit
      # itself never going down. 300s is 5x the tick.
      # This stops the false alarms; it does not fix the cause — the
      # per-container loop should not be racing the reaper at all.
      - HEARTBEAT_TIMEOUT=300
      # Idle auto-shutdown fires at 15 minutes of no traffic, not the 1h default.
      # Only containers labelled locator.idle.stop=true are eligible.
      - IDLE_DEFAULT_TIMEOUT=900
      - GIT_AUTO_PUSH=true
      - GIT_REMOTE=${GIT_REMOTE:-}
      - PYTHONUNBUFFERED=1
      - LOCATOR_IS_PRIMARY=false
      - SELF_CONTAINER_NAME=locator
      # bao.py's compiled-in default is unit4's tailnet address, which is
      # dead (Azure billing) — every bao:// secret resolution 502'd through
      # /api/secrets/unit-resolve and took repo-sync git tokens with it.
      # unit7 runs the surviving OpenBao; bound on the tailnet IP.
      - BAO_ADDR=${BAO_ADDR:-http://100.99.131.20:8200}
      # Was off since 2026-08-09 after the balancer queued a move of mariadb-11.4
      # (PowerDNS's DB) off an exact-vs-substring pin-check bug — fixed same day
      # (unified pin-check, locator.yml's stationary flag actually wired up), but
      # the switch itself was never flipped back on. Re-enabled 2026-09-15 after
      # re-verifying _is_pinned() live against every critical DB/edge service
      # (mariadb-11.4, comms-postgres, mariadb-pdns-primary, postgres,
      # postgres-inventory-backup, matomo-db, synapse, chatwoot-rails, traefik,
      # lokey, pdns, dnsdist, redis, wg-easy) and adding the one real remaining
      # gap found: vaultwarden had no locator.yml entry at all.
      - BALANCE_ENABLED=true
      - ELECTION_DRY_RUN=false
      # Veto at 90, not 97: the goal is never sitting at 96%, and a target at
      # 90%+ receiving a migration IS how a unit gets there. Below this the
      # balancer already treats disk as the primary load; past it a unit can
      # shed but never receive.
      - DISK_VETO_PERCENT=90
      # Emergency drain starts at 92 — between the veto and a genuinely full
      # disk — so a climbing unit gets migrated off on the OOM path (cooldown
      # and anti-flap bypassed) instead of waiting for strikes while the disk
      # fills. lokey's janitor escalates to image-prune -a at 93.
      - DISK_CRIT_PERCENT=92
      - DATABASE_URL=${DATABASE_URL}
      - LOCATOR_CANONICAL_URL=https://locator.prime-quality.online
      # Traccar runs on unit9 as a systemd service on :8082. Nothing has served
      # 80/443 there since its Caddy went away, so the default host
      # (traccar.theofficialblacksheepco.online) resolves to a machine with no
      # listener - and that domain is SafeBrowse-blocked besides. This route
      # goes through unit8's Traefik, which reaches unit9 over the tailnet.
      - TRACCAR_HOST=traccar.prime-quality.online
      - TRACCAR_PASS=Thegr81234Thegr81234!
      - LOCATOR_ADMIN_KEY=${LOCATOR_ADMIN_KEY:-}
      # Level 9 (INFRA) service identity for the AI assistant. Separate from
      # LOCATOR_ADMIN_KEY on purpose: that one grants ROOT and must stay human.
      - LOCATOR_AI_ADMIN_KEY=${LOCATOR_AI_ADMIN_KEY:-}
      - CLEARANCE_ENFORCE=true
      # Deliberately OFF, and spelled `false` rather than the previous `-true`
      # (which parsed as false anyway — clearance.py tests
      # `.lower() in ("1","true","yes")` — so enforcement was silently inert).
      # Turning THIS on gates /register and the node/metric push behind the
      # admin key, and per clearance.py's own warning that black-holes the
      # mesh's telemetry until every unit agent ships a key. Flip it only then.
      - CLEARANCE_ENFORCE_INGEST=false
      # MUST be the string the realm puts in `iss`, not an alias that merely
      # serves the realm. auth...online serves this same realm but its
      # discovery doc declares the .com issuer, so tokens failed validation.
      - OIDC_ISSUER=${OIDC_ISSUER:-https://auth.theofficialblacksheepco.com/realms/blacksheep}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-locator,client-portal}
      # Host for kc_admin.py's admin REST calls. Was unset, so it fell back to
      # its own default of https://bsco-keycloak.fly.dev — admin calls went to
      # the dead fly host while tokens validated against the .com issuer above.
      # These two must name the same Keycloak.
      - KC_BASE=${KC_BASE:-https://auth.theofficialblacksheepco.com}
      - KC_admin-cli_CLIENT_ID=${KC_ADMIN_CLIENT_ID:-clearance-admin}
      - KC_admin-cli_CLIENT_SECRET=${KC_ADMIN_CLIENT_SECRET:-}
      - LOCATOR_CLIENT_SECRET=${LOCATOR_CLIENT_SECRET}
      - LOCATOR_CLIENT_ID=${LOCATOR_CLIENT_ID}
    labels:
      - "traefik.enable=true"
      # UI router — protected by Keycloak (catch-all, lower priority)
      - "traefik.http.routers.locator.rule=Host(`locator.prime-quality.online`)"
      - "traefik.http.routers.locator.entrypoints=websecure"
      - "traefik.http.routers.locator.tls=true"
      # No certresolver: this domain terminates at unit9's edge, so TLS-ALPN
      # here can never authorize — it was just burning LE rate-limit budget.
      # Re-add myresolver if DNS ever points back to this unit.
      - "traefik.http.routers.locator.priority=100"
      - "traefik.http.routers.locator.service=locator"
      # API router — no auth so lokey heartbeats and all programmatic calls pass through
      - "traefik.http.routers.locator-api.rule=Host(`locator.prime-quality.online`) && (PathPrefix(`/api/`) || PathPrefix(`/register`) || PathPrefix(`/deregister/`) || PathPrefix(`/nodes/`) || PathPrefix(`/wake/`) || PathPrefix(`/health`) || Path(`/silent-check-sso.html`) || PathPrefix(`/static/lokey-android`))"
      - "traefik.http.routers.locator-api.entrypoints=websecure"
      - "traefik.http.routers.locator-api.tls=true"
      # certresolver intentionally omitted — see locator router note above.
      - "traefik.http.routers.locator-api.priority=200"
      - "traefik.http.routers.locator-api.service=locator"
      - "traefik.http.services.locator.loadbalancer.server.port=5000"
    networks:
      - networking

  # Publishes locator on the tailnet at 100.99.131.20:15000 — the upstream
  # unit9's nginx edge and the /__wake/ traefik route proxy through. Was an
  # ad-hoc `docker run`; kept getting swept by `docker compose up` orphan
  # handling, so it's a managed service now.
  tailnet-pub:
    image: alpine/socat
    container_name: locator-tailnet-pub
    restart: unless-stopped
    command: ["TCP-LISTEN:8080,fork,reuseaddr", "TCP:locator:5000"]
    ports:
      - "100.99.131.20:15000:8080"
    networks:
      - networking

networks:
  networking:
    external: true
